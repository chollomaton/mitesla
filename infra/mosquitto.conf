# Mosquitto — broker MQTT LOCAL para la VM de Mi Tesla (Fase 4A).
# Solo escucha en localhost: ni fleet-telemetry ni el bridge necesitan que este puerto
# salga a Internet, y así evitamos abrir un puerto más en el firewall de la VM.
listener 1883 127.0.0.1

# Sin autenticación de usuario/contraseña: como solo escucha en loopback, el aislamiento
# real lo da la propia VM (nadie fuera de ella puede alcanzar el puerto). Si en el futuro
# Mosquitto y el bridge corrieran en máquinas distintas, esto DEBE cambiar a listener con
# TLS + usuario/contraseña (ver mosquitto_passwd) — no lo necesitamos para un único proceso
# en la misma VM, y así evitamos coste/complejidad innecesaria (sección 84).
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
